name: sync-upstream-weights

on:
  schedule:
    - cron: "17 6 * * *"   # daily 06:17 UTC; X re-syncs param.rs defaults by cron, we pick it up the next morning
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract and diff parameters from xai-org/x-algorithm
        id: sync
        run: |
          set +e
          python scripts/sync.py --clone | tee sync.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "3" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then exit "$code"; fi

      - name: Regenerate README weights table
        run: python scripts/render_readme.py

      - name: Commit updated data
        run: |
          git config user.name "xboss bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data CHANGELOG.md README.md
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "sync: upstream parameters $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Open an issue describing the change
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="X changed its For You parameters ($(date -u +%Y-%m-%d))"
          body="$(cat data/last_change.md)"
          gh issue create --title "$title" --body "$body"$'\n\n'"Diff detected by scripts/sync.py against https://github.com/xai-org/x-algorithm. See CHANGELOG.md." --label "upstream-change" || \
          gh issue create --title "$title" --body "$body"
